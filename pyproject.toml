[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bejeweled-player"
version = "0.1.0"
description = "Wireless-ADB strategic match-3 autoplayer"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8", "ruff>=0.6"]

[project.scripts]
autoplayer = "bejeweled_player.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bejeweled_player"]
